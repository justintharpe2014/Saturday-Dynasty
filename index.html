const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const one=a=>a[rnd(0,a.length-1)];
const id=()=>Math.random().toString(36).slice(2,10);

function player(pos,yr,base){
  let ovr=Math.max(40,Math.min(98,base+rnd(-11,11)));
  return {
    id:id(),
    name:nm(),
    pos,
    yr,
    ovr,
    pot:Math.min(99,ovr+rnd(3,23)),
    dev:one(['Normal','Normal','Impact','Star','Elite']),
    redshirt:false,
    used:false,
    stats:{games:0,yards:0,td:0},
    origin:null
  };
}

function coach(name,role,teamId,realName=false){
  return {
    id:id(),
    name,
    role,
    teamId,
    realName,
    age:rnd(35,65),
    skill:rnd(48,90),
    recruit:rnd(45,90),
    develop:rnd(45,90),

    },

    assigned:[],

  };
}

function create(){
  let coaches=[];
  let teams=[];

  for(let [conf,list] of Object.entries(groups)){
    for(let name of list.split(',')){
      let i=teams.length;

      let prestige=[
        'Alabama','Georgia','Ohio State','Texas',
        'Notre Dame','Michigan','Oregon'
      ].includes(name)?5:
      ['SEC','Big Ten','Big 12','ACC'].includes(conf)?4:
      conf==='Independent'?3:2;

      let hc=coach(real[name]||nm(),'HC',i,!!real[name]);
      let oc=coach(nm(),'OC',i);
      let dc=coach(nm(),'DC',i);

      coaches.push(hc,oc,dc);

      teams.push({
        id:i,
        name,
        conf,
        prestige,
        coach:hc.id,
        oc:oc.id,
        dc:dc.id,
        roster:Array.from(
          {length:85},
          (_,j)=>player(
            positions[j%positions.length],
            rnd(1,4),
            51+prestige*5
          )
        ),
        wins:0,
        losses:0,
        cwins:0,
        closses:0,
        history:[],
        rank:0,
        nil:prestige*300,
        offers:[],
        classHistory:[]
      });
    }
  }

  let user=coach(
    'Your Coach',
    'HC',
    teams.find(t=>t.name==='Arkansas State').id
  );

  coaches.push(user);
  teams[user.teamId].coach=user.id;

  let s={
    version:5,
    year:2026,
    week:1,
    teams,
    coaches,
    user:user.id,
    recruits:[],
    games:[],
    news:[
      'Welcome to Saturday Dynasty. All high school prospects are graduating seniors.'
    ],
    results:[],
    champions:[],
    hours:600,
    settings:{
      nil:'balanced',
      recruiting:'assisted'
    },
    jobs:[],
    playoff:[],
    seasonHistory:[]
  };

  makeRecruits(s);
  schedule(s);
  return s;
}

function makeRecruits(s){
  s.recruits=Array.from({length:650},(_,i)=>{
    let stars=i<25?5:i<155?4:i<450?3:2;
    let p=player(one(positions),0,stars*11+25);

    return {
      ...p,
      stars,
      rank:i+1,
      home:one(states),
      target:false,
      offer:false,
      committed:null,
      scout:0,
      interest:{},
      hours:{},
      assigned:null,
      visit:false,
      nil:rnd(0,stars*65),
      priority:2,
      promises:[],
      signed:false
    };
  });
}

function schedule(s){
  s.games=[];

  for(let w=1;w<=12;w++){
    let paired=new Set();

    for(let t of s.teams){
      if(paired.has(t.id))continue;

      let candidates=s.teams.filter(
        x=>x.id!==t.id&&!paired.has(x.id)
      );

      let same=candidates.filter(
        x=>x.conf===t.conf
      );

      let opponent=one(
        same.length&&w<=8?same:candidates
      );

      if(!opponent)continue;

      paired.add(t.id);
      paired.add(opponent.id);

      s.games.push({
        week:w,
        a:t.id,
        b:opponent.id,
        played:false,
        conference:t.conf===opponent.conf
      });
    }
  }
}

function user(){
  return S.coaches.find(c=>c.id===S.user);
}

function team(){
  return S.teams[user().teamId];
}

function c(id){
  return S.coaches.find(x=>x.id===id);
}

function scoreCoach(x){
  let a=x.career;

  return (
    a.wins*10+
    a.conferenceWins*5+
    a.conferenceTitles*150+
    a.bowlWins*50+
    a.playoffWins*100+
    a.titles*500+
    a.top5*75+
    a.no1*150+
    a.fiveStars*20
  );
}

function strength(t){
  let r=[...t.roster]
    .sort((a,b)=>b.ovr-a.ovr)
    .slice(0,45);

  let co=c(t.coach);

  return (
    r.reduce((a,p)=>a+p.ovr,0)/r.length+
    t.prestige*1.5+
    (co?.skill||65)/10+
    (c(t.oc)?.skill||60)/20+
    (c(t.dc)?.skill||60)/20+
    (co?.skills.Tactician||0)*1.5
  );
}

function influence(r,t){
  return r.interest[t.id]??(
    r.interest[t.id]=
      rnd(0,20)+
      t.prestige*5+
      (r.home==='AR'&&t.name.includes('Arkansas')?15:0)
  );
}

function addNews(s){
  S.news.unshift(s);
  S.news=S.news.slice(0,65);
}

function save(){

}

function exportSave(){

function importSave(el){

  f.text().then(x=>{

}

function recruitAction(id,action){
  let r=S.recruits.find(x=>x.id===id);

  let cost={
    Scout:10,
    Contact:10,
    Pitch:25,
    Visit:40,
    Promise:15
  }[action];

  if(!r||S.hours<cost){
    return alert('Not enough recruiting hours');
  }

  S.hours-=cost;

  if(action==='Scout'){
    r.scout=Math.min(100,r.scout+35);
  }else if(action==='Visit'){
    r.visit=true;
  }else if(action==='Promise'){
    if(!r.promises.includes('Playing time')){
      r.promises.push('Playing time');
    }
  }else{
    r.interest[team().id]=
      influence(r,team())+
      (action==='Pitch'?rnd(9,18):rnd(4,9))+
      user().skills.Recruiter*2;
  }

  r.target=true;
  save();
  showRecruit(id);
}

function offer(id){

  if(!r||r.committed!==null)return;

  r.offer=!r.offer;
  r.target=true;

  save();
  showRecruit(id);
}

function target(id){

  r.target=!r.target;

  save();

}

function assign(id,role){

  r.assigned=role||null;

  save();
  showRecruit(id);
}

/* SATURDAY DYNASTY — PART 4
   GAME ENGINE, RECRUITING, POSTSEASON AND COACHING
*/

function teamRating(t){
  return strength(t);
}

function playGame(g,postseason=false){
  if(g.played)return g;

  let a=S.teams[g.a];
  let b=S.teams[g.b];

  if(!a||!b)return g;

  let ra=teamRating(a);
  let rb=teamRating(b);

  let home=2.5;
  let swing=rnd(-18,18);
  let difference=ra-rb+home+swing;

  let baseA=rnd(17,34);
  let baseB=rnd(17,34);

  let pointsA=Math.max(
    3,
    baseA+Math.round(difference*.65)
  );

  let pointsB=Math.max(
    3,
    baseB-Math.round(difference*.65)
  );

  if(pointsA===pointsB){
    if(Math.random()<.5)pointsA+=3;
    else pointsB+=3;
  }

  g.sa=pointsA;
  g.sb=pointsB;
  g.played=true;
  g.winner=pointsA>pointsB?a.id:b.id;
  g.loser=pointsA>pointsB?b.id:a.id;

  if(!postseason){
    a.wins+=pointsA>pointsB?1:0;
    a.losses+=pointsA<pointsB?1:0;

    b.wins+=pointsB>pointsA?1:0;
    b.losses+=pointsB<pointsA?1:0;

    if(g.conference){
      a.cwins+=pointsA>pointsB?1:0;
      a.closses+=pointsA<pointsB?1:0;

      b.cwins+=pointsB>pointsA?1:0;
      b.closses+=pointsB<pointsA?1:0;
    }

    let ca=c(a.coach);
    let cb=c(b.coach);

    if(ca){
      ca.career.wins+=pointsA>pointsB?1:0;
      ca.career.losses+=pointsA<pointsB?1:0;
      if(g.conference&&pointsA>pointsB){
        ca.career.conferenceWins++;
      }
    }

    if(cb){
      cb.career.wins+=pointsB>pointsA?1:0;
      cb.career.losses+=pointsB<pointsA?1:0;
      if(g.conference&&pointsB>pointsA){
        cb.career.conferenceWins++;
      }
    }
  }

  return g;
}

function gameText(g){
  let a=S.teams[g.a];
  let b=S.teams[g.b];

  return `${a.name} ${g.sa} — ${b.name} ${g.sb}`;
}

function weeklyRecruiting(){
  for(let r of S.recruits){
    if(r.committed!==null)continue;

    let contenders=S.teams
      .map(t=>({
        t,
        value:influence(r,t)
      }))
      .sort((a,b)=>b.value-a.value);

    for(let x of contenders.slice(0,7)){
      let boost=rnd(1,8);

      if(x.t.id===team().id){
        if(r.target)boost+=3;

        if(r.assigned==='oc'){
          boost+=Math.round(
            (c(team().oc)?.recruit||60)/22
          );
        }

        if(r.assigned==='dc'){
          boost+=Math.round(
            (c(team().dc)?.recruit||60)/22
          );
        }

        if(r.offer)boost+=2;
        if(r.visit)boost+=5;
      }

      r.interest[x.t.id]=
        influence(r,x.t)+boost;
    }

    let ranked=S.teams
      .map(t=>({
        t,
        value:influence(r,t)
      }))
      .sort((a,b)=>b.value-a.value);

    let leader=ranked[0];
    let second=ranked[1];

    let threshold=
      r.stars===5?125:
      r.stars===4?110:
      r.stars===3?95:80;

    let advantage=
      leader.value-(second?.value||0);

    let chance=
      S.week>=8?.19:
      S.week>=5?.12:.05;

    if(
      leader.value>=threshold&&
      advantage>=10&&
      Math.random()<chance
    ){
      if(
        leader.t.id===team().id&&!r.offer
      ){
        continue;
      }

      r.committed=leader.t.id;

      if(leader.t.id===team().id){
        addNews(
          `COMMITMENT: ${r.stars}-star ${r.pos} `+
          `${r.name} committed to ${team().name}!`
        );

        if(r.stars===5){
          user().career.fiveStars++;
        }

        if(r.stars>=4){
          spotlight(
            'RECRUITING VICTORY',
            `${r.name}`,
            `${'★'.repeat(r.stars)} ${r.pos} · `+
            `National #${r.rank}`
          );
        }
      }
    }
  }
}

function assistantRecruiting(){
  let assigned=S.recruits.filter(
    r=>r.committed===null&&
       r.target&&r.assigned
  );

  for(let r of assigned){
    let staff=r.assigned==='oc'
      ?c(team().oc)
      :c(team().dc);

    if(!staff)continue;

    let gain=rnd(3,7)+
      Math.round(staff.recruit/20);

    r.interest[team().id]=
      influence(r,team())+gain;
  }
}

function rankings(){
  return [...S.teams].sort((a,b)=>{
    let pa=
      a.wins*10-
      a.losses*4+
      teamRating(a)*.4;

    let pb=
      b.wins*10-
      b.losses*4+
      teamRating(b)*.4;

    return pb-pa;
  });
}

function updateRankings(){
  rankings().forEach((t,i)=>{
    t.rank=i+1;
  });
}

function weeklyDevelopment(){
  for(let t of S.teams){
    let staff=c(t.coach);
    let bonus=staff?.skills.Developer||0;

    for(let p of t.roster){
      if(Math.random()<.09+bonus*.01){
        if(p.ovr<p.pot){
          p.ovr+=1;
        }
      }
    }
  }
}

function advanceWeek(){
  if(S.week>12){
    return alert(
      'The regular season is complete. '+
      'Advance to the postseason.'
    );
  }

  let games=S.games.filter(
    g=>g.week===S.week
  );

  for(let g of games){
    playGame(g);
  }

  assistantRecruiting();
  weeklyRecruiting();
  weeklyDevelopment();
  updateRankings();

  let mine=games.find(
    g=>g.a===team().id||g.b===team().id
  );

  if(mine){
    let won=mine.winner===team().id;

    addNews(
      `WEEK ${S.week}: ${gameText(mine)} `+
      `— ${won?'WIN':'LOSS'}`
    );
  }

  S.results.push({
    year:S.year,
    week:S.week,
    games:games.map(g=>({
      a:g.a,
      b:g.b,
      sa:g.sa,
      sb:g.sb,
      winner:g.winner
    }))
  });

  S.week++;
  S.hours=600;

  if(S.week===13){
    addNews(
      `${S.year} regular season complete. `+
      'Conference championships are next.'
    );
  }

  save();
}

function conferenceStandings(conf){
  return S.teams
    .filter(t=>t.conf===conf)
    .sort((a,b)=>
      b.cwins-a.cwins||
      b.wins-a.wins||
      teamRating(b)-teamRating(a)
    );
}

function postseasonGame(a,b,type){
  let g={
    id:id(),
    week:13,
    a:a.id,
    b:b.id,
    type,
    played:false,
    conference:false
  };

  playGame(g,true);

  let winner=S.teams[g.winner];
  let loser=S.teams[g.loser];

  let wc=c(winner.coach);
  let lc=c(loser.coach);

  if(wc){
    wc.career.wins++;
  }

  if(lc){
    lc.career.losses++;
  }

  if(type==='Bowl'){
    if(wc)wc.career.bowlWins++;
  }

  if(type==='CFP'){
    if(wc)wc.career.playoffWins++;
  }

  if(type==='Conference Championship'){
    if(wc)wc.career.conferenceTitles++;
  }

  S.results.push({
    year:S.year,
    type,
    game:g
  });

  return g;
}

function conferenceChampionships(){
  let champs=[];
  let games=[];

  for(let conf of Object.keys(groups)){
    let standings=conferenceStandings(conf);

    if(standings.length<2)continue;

    let g=postseasonGame(
      standings[0],
      standings[1],
      'Conference Championship'
    );

    games.push(g);
    champs.push(S.teams[g.winner]);

    if(
      g.a===team().id||
      g.b===team().id
    ){
      if(g.winner===team().id){
        spotlight(
          'CONFERENCE CHAMPIONS',
          team().name,
          `${conf} Champions · ${S.year}`
        );
      }
    }
  }

  return {champs,games};
}

function playoffField(){
  let ranked=rankings();
  let champions=S._conferenceChampions||[];

  let chosen=[];

  let bestChampions=[...champions]
    .sort((a,b)=>
      ranked.indexOf(a)-ranked.indexOf(b)
    )
    .slice(0,5);

  for(let t of bestChampions){
    if(!chosen.includes(t)){
      chosen.push(t);
    }
  }

  for(let t of ranked){
    if(chosen.length>=12)break;

    if(!chosen.includes(t)){
      chosen.push(t);
    }
  }

  return chosen.sort((a,b)=>
    ranked.indexOf(a)-ranked.indexOf(b)
  );
}

function runPlayoff(){
  let seeds=playoffField();

  if(seeds.length!==12){
    throw Error('Playoff field must have 12 teams.');
  }

  let games=[];
  let winners=[];

  let firstRound=[
    [seeds[4],seeds[11]],
    [seeds[5],seeds[10]],
    [seeds[6],seeds[9]],
    [seeds[7],seeds[8]]
  ];

  for(let [a,b] of firstRound){
    let g=postseasonGame(a,b,'CFP');

    games.push(g);
    winners.push(S.teams[g.winner]);
  }

  let quarters=[
    [seeds[0],winners[3]],
    [seeds[1],winners[2]],
    [seeds[2],winners[1]],
    [seeds[3],winners[0]]
  ];

  let semifinalists=[];

  for(let [a,b] of quarters){
    let g=postseasonGame(a,b,'CFP');

    games.push(g);
    semifinalists.push(S.teams[g.winner]);
  }

  let semi1=postseasonGame(
    semifinalists[0],
    semifinalists[3],
    'CFP'
  );

  let semi2=postseasonGame(
    semifinalists[1],
    semifinalists[2],
    'CFP'
  );

  games.push(semi1,semi2);

  let final=postseasonGame(
    S.teams[semi1.winner],
    S.teams[semi2.winner],
    'CFP'
  );

  games.push(final);

  let champion=S.teams[final.winner];
  let coachOfChampion=c(champion.coach);

  if(coachOfChampion){
    coachOfChampion.career.titles++;
  }

  S.champions.push({
    year:S.year,
    team:champion.id,
    coach:champion.coach,
    score:gameText(final)
  });

  if(champion.id===team().id){
    spotlight(
      'NATIONAL CHAMPIONS',
      team().name,
      `${S.year} College Football Playoff Champions`
    );
  }

  return {seeds,games,champion};
}

function runBowls(playoffTeams){
  let excluded=new Set(
    playoffTeams.map(t=>t.id)
  );

  let eligible=rankings()
    .filter(t=>
      t.wins>=6&&!excluded.has(t.id)
    );

  let games=[];

  for(let i=0;i+1<eligible.length;i+=2){
    let g=postseasonGame(
      eligible[i],
      eligible[i+1],
      'Bowl'
    );

    games.push(g);

    if(
      g.winner===team().id
    ){
      spotlight(
        'BOWL CHAMPIONS',
        team().name,
        gameText(g)
      );
    }
  }

  return games;
}

function recruitingClassRankings(){
  let ranked=S.teams.map(t=>{
    let commits=S.recruits.filter(
      r=>r.committed===t.id
    );

    let points=commits.reduce(
      (sum,r)=>
        sum+r.stars*20+
        Math.round(r.ovr*.35),
      0
    );

    return {
      team:t,
      commits,
      points
    };
  });

  return ranked.sort(
    (a,b)=>b.points-a.points
  );
}

function signRecruits(){
  let classes=recruitingClassRankings();

  classes.forEach((x,i)=>{
    let t=x.team;

    t.classHistory.push({
      year:S.year,
      rank:i+1,
      points:x.points,
      commits:x.commits.length,
      fiveStars:x.commits.filter(
        r=>r.stars===5
      ).length
    });

    let hc=c(t.coach);

    if(hc){
      if(i===0)hc.career.no1++;
      if(i<5)hc.career.top5++;
    }

    for(let r of x.commits){
      t.roster.push({
        ...player(r.pos,1,r.ovr),
        name:r.name,
        ovr:r.ovr,
        pot:r.pot,
        dev:r.dev,
        origin:{
          year:S.year,
          rank:r.rank,
          stars:r.stars
        }
      });

      r.signed=true;
    }
  });

  return classes;
}

function graduatePlayers(){
  for(let t of S.teams){
    t.roster=t.roster.filter(p=>{
      if(p.yr>=4){
        return false;
      }

      p.yr++;
      p.used=false;

      let growth=
        p.dev==='Elite'?rnd(3,7):
        p.dev==='Star'?rnd(2,5):
        p.dev==='Impact'?rnd(1,4):
        rnd(0,3);

      let staff=c(t.coach);

      growth+=staff?.skills.Developer||0;

      p.ovr=Math.min(
        p.pot,
        p.ovr+growth
      );

      return true;
    });

    while(t.roster.length<70){
      t.roster.push(
        player(
          one(positions),
          rnd(1,3),
          49+t.prestige*5
        )
      );
    }

    t.roster=t.roster
      .sort((a,b)=>b.ovr-a.ovr)
      .slice(0,95);
  }
}

function coachSeasonHistory(){
  for(let t of S.teams){
    let hc=c(t.coach);

    if(!hc)continue;

    hc.history.push({
      year:S.year,
      school:t.name,
      wins:t.wins,
      losses:t.losses,
      conferenceWins:t.cwins,
      conferenceLosses:t.closses
    });

    hc.xp+=
      t.wins*12+
      t.cwins*5;

    while(hc.xp>=hc.level*100){
      hc.xp-=hc.level*100;
      hc.level++;
      hc.points++;
    }

    hc.age++;
    hc.contract=Math.max(
      0,hc.contract-1
    );

    if(hc.history.length>=35){
      hc.retired=true;
    }
  }
}

function availableCoaches(){
  return S.coaches.filter(
    x=>!x.retired&&x.role==='HC'
  );
}

function hireReplacement(t){
  let candidate=coach(
    nm(),
    'HC',
    t.id
  );

  candidate.age=rnd(34,49);
  candidate.skill=rnd(52,77);

  S.coaches.push(candidate);
  t.coach=candidate.id;

  return candidate;
}

function coachingCarousel(){
  let changes=[];

  for(let t of S.teams){
    let hc=c(t.coach);

    if(!hc)continue;

    if(hc.id===S.user)continue;

    let shouldReplace=
      hc.retired||
      (t.wins<=3&&Math.random()<.12);

    if(shouldReplace){
      let oldName=hc.name;

      hc.retired=true;

      let replacement=hireReplacement(t);

      changes.push({
        school:t.name,
        old:oldName,
        next:replacement.name
      });
    }
  }

  S.jobs=changes;

  if(changes.length){
    addNews(
      `COACHING CAROUSEL: ${changes.length} `+
      'programs have changed head coaches.'
    );
  }

  return changes;
}

function finishSeason(){
  if(S.week<=12){
    return alert(
      'Finish all 12 regular-season weeks first.'
    );
  }

  if(S.week===14){
    return alert(
      'This season has already been completed.'
    );
  }

  updateRankings();

  let conference=conferenceChampionships();

  S._conferenceChampions=conference.champs.map(
    t=>t
  );

  let playoff=runPlayoff();
  let bowls=runBowls(playoff.seeds);

  let classes=signRecruits();

  let mine=team();

  S.seasonHistory.push({
    year:S.year,
    userSchool:mine.name,
    wins:mine.wins,
    losses:mine.losses,
    champion:playoff.champion.name,
    recruitingRank:
      classes.findIndex(
        x=>x.team.id===mine.id
      )+1,
    playoffTeams:playoff.seeds.map(
      t=>t.name
    )
  });

  coachSeasonHistory();
  coachingCarousel();

  S.playoff=playoff.games;

  S.week=14;

  addNews(
    `${S.year} NATIONAL CHAMPION: `+
    playoff.champion.name
  );

  save();
}

function startNextSeason(){
  if(S.week!==14){
    return alert(
      'Complete the current postseason first.'
    );
  }

  if(user().retired){
    return alert(
      'Your coaching career has reached its end.'
    );
  }

  if(user().history.length>=35){
    user().retired=true;

    save();

    spotlight(
      'LEGENDARY CAREER',
      user().name,
      '35 seasons completed. Your dynasty is retired.'
    );

    return;
  }

  graduatePlayers();

  S.year++;
  S.week=1;
  S.hours=600;
  S.playoff=[];
  S._conferenceChampions=[];

  for(let t of S.teams){
    t.wins=0;
    t.losses=0;
    t.cwins=0;
    t.closses=0;
    t.rank=0;
  }

  makeRecruits(S);
  schedule(S);
  updateRankings();

  addNews(
    `WELCOME TO THE ${S.year} SEASON!`
  );

  save();
}

function trainCoach(skill){
  let hc=user();

  if(hc.points<=0){
    return alert(
      'No available coaching skill points.'
    );
  }

  if(!(skill in hc.skills)){
    return;
  }

  if(hc.skills[skill]>=5){
    return alert(
      'This coaching skill is already maxed out.'
    );
  }

  hc.skills[skill]++;
  hc.points--;

  save();
}

function changeProgram(id){
  let hc=user();
  let old=team();
  let next=S.teams.find(
    t=>t.id===Number(id)
  );

  if(!next||next.id===old.id)return;

  let previous=c(next.coach);

  if(previous){
    previous.retired=true;
  }

  hireReplacement(old);

  hc.teamId=next.id;
  next.coach=hc.id;

  addNews(
    `${hc.name} accepted the head coaching `+
    `position at ${next.name}.`
  );

  save();
}

function retireDynasty(){
  if(!confirm(
    'Retire your coach and end this dynasty?'
  )){
    return;
  }

  user().retired=true;

  save();

  spotlight(
    'CAREER COMPLETE',
    user().name,
    `${user().career.wins} wins · `+
    `${user().career.titles} national titles`
  );
}

function migrate(z){
  if(!z||!Array.isArray(z.teams)||
     !Array.isArray(z.coaches)){
    throw Error('Invalid Saturday Dynasty save file.');
  }

  z.version=5;
  z.news=Array.isArray(z.news)?z.news:[];
  z.results=Array.isArray(z.results)?z.results:[];
  z.champions=Array.isArray(z.champions)?z.champions:[];
  z.seasonHistory=Array.isArray(z.seasonHistory)
    ?z.seasonHistory:[];
  z.jobs=Array.isArray(z.jobs)?z.jobs:[];
  z.playoff=Array.isArray(z.playoff)?z.playoff:[];
  z.hours=Number.isFinite(z.hours)?z.hours:600;

  z.settings={
    nil:'balanced',
    recruiting:'assisted',
    mode:'serious',
    recruitingBoost:0,
    developmentBoost:0,
    gameBoost:0,
    ...z.settings
  };

  for(const t of z.teams){
    t.roster=Array.isArray(t.roster)?t.roster:[];
    t.history=Array.isArray(t.history)?t.history:[];
    t.classHistory=Array.isArray(t.classHistory)
      ?t.classHistory:[];
    t.wins=t.wins||0;
    t.losses=t.losses||0;
    t.cwins=t.cwins||0;
    t.closses=t.closses||0;
  }

  for(const x of z.coaches){
    x.history=Array.isArray(x.history)?x.history:[];
    x.skills={
      Recruiter:0,
      Developer:0,
      Tactician:0,
      CEO:0,
      ...x.skills
    };
    x.career={
      wins:0,
      losses:0,
      conferenceWins:0,
      conferenceTitles:0,
      bowlWins:0,
      playoffWins:0,
      titles:0,
      top5:0,
      no1:0,
      fiveStars:0,
      ...x.career
    };
  }

  return z;
}

function newGame(){
  if(S&&!confirm(
    'Start a new dynasty? Your current local save '+
    'will be replaced. Export it first if needed.'
  ))return;

  const mode=prompt(
    'Choose a mode:\n'+
    '1 = Serious Simulation\n'+
    '2 = Arcade / Chaos',
    '1'
  );

  if(mode===null)return;

  S=create();
  S.settings.mode=mode.trim()==='2'
    ?'arcade':'serious';

  const name=prompt(
    'Enter your head coach name:',
    'Coach'
  );

  if(name&&name.trim()){
    user().name=name.trim().slice(0,45);
  }

  const schools=S.teams
    .map(t=>t.name)
    .join(', ');

  const selected=prompt(
    'Enter the name of your starting school.\n'+
    'Example: Arkansas State, Alabama, Notre Dame',
    'Arkansas State'
  );

  if(selected){
    const chosen=S.teams.find(
      t=>t.name.toLowerCase()===
      selected.trim().toLowerCase()
    );

    if(chosen){
      const old=team();
      const original=c(chosen.coach);

      if(original&&original.id!==S.user){
        original.retired=true;
      }

      if(old.id!==chosen.id){
        hireReplacement(old);
      }

      user().teamId=chosen.id;
      chosen.coach=S.user;
    }else{
      alert(
        'School not recognized. Starting at Arkansas State.'
      );
    }
  }

  updateRankings();
  tab='Office';
  save();
}

                ${x.career.wins}-${x.career.losses}
              </td>
              <td>${x.career.titles}</td>
              <td>
                ${scoreCoach(x).toLocaleString()}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </section>

    <section>
      <h3>Your Coaching Legacy</h3>

      <div class="grid">
        ${stat('Wins',user().career.wins)}
        ${stat('Conference Titles',
          user().career.conferenceTitles)}
        ${stat('Bowl Wins',
          user().career.bowlWins)}
        ${stat('Playoff Wins',
          user().career.playoffWins)}
        ${stat('National Titles',
          user().career.titles)}
        ${stat('Top-5 Recruiting Classes',
          user().career.top5)}
      </div>
    </section>
  `;
}

function arcadePlayer(){
  if(S.settings.mode!=='arcade'){
    return alert('Arcade mode only.');
  }

  const name=prompt(
    'Player name:',
    'Five Star Prospect'
  );

  if(!name)return;

  const pos=prompt(
    'Position (QB, HB, WR, TE, OT, OG, C, DE, DT, OLB, MLB, CB, FS, SS):',
    'QB'
  );

  if(!pos)return;

  const ovr=Number(prompt(
    'Overall rating (40-99):',
    '95'
  ));

  if(!Number.isFinite(ovr))return;

  const p=player(
    pos.toUpperCase().slice(0,3),
    1,
    Math.max(40,Math.min(99,ovr))
  );

  p.name=name.trim().slice(0,45);
  p.ovr=Math.max(40,Math.min(99,Math.round(ovr)));
  p.pot=99;
  p.dev='Elite';
  p.origin={
    year:S.year,
    stars:5,
    arcade:true
  };

  team().roster.push(p);

  addNews(
    `ARCADE: ${p.name} joins ${team().name}!`
  );

  save();
}

function arcadeCoach(){
  if(S.settings.mode!=='arcade'){
    return alert('Arcade mode only.');
  }

  const name=prompt(
    'Enter your coach name:',
    user().name
  );

  if(name&&name.trim()){
    user().name=name.trim().slice(0,45);
  }

  const age=Number(prompt(
    'Coach age:',
    String(user().age)
  ));

  if(Number.isFinite(age)&&age>=18&&age<=90){
    user().age=Math.round(age);
  }

  const scheme=prompt(
    'Offensive philosophy:',
    user().scheme
  );

  if(scheme&&scheme.trim()){
    user().scheme=scheme.trim().slice(0,40);
  }

  save();
}

function arcadeBoost(type,amount){
  if(S.settings.mode!=='arcade'){
    return alert('Arcade mode only.');
  }

  const hc=user();

  if(type==='recruit'){
    hc.recruit=Math.max(
      1,Math.min(99,hc.recruit+amount)
    );
  }

  if(type==='develop'){
    hc.develop=Math.max(
      1,Math.min(99,hc.develop+amount)
    );

    for(const p of team().roster){
      p.pot=Math.min(99,p.pot+amount);
    }
  }

  if(type==='skill'){
    hc.skill=Math.max(
      1,Math.min(99,hc.skill+amount)
    );
  }

  save();
}

function renderArcade(){
  const enabled=S.settings.mode==='arcade';

  return `
    <h2>Arcade / Chaos Lab</h2>

    <section class="arcade">
      <h3>
        ${enabled?'Arcade Mode Active':'Serious Mode Active'}
      </h3>

      <p>
        Serious and Arcade dynasties use the same
        simulation engine. Arcade mode unlocks
        custom players and coaching boosts.
      </p>

      ${enabled?`
        <div class="row">
          ${button('Create a Player',
            'arcadePlayer()')}
          ${button('Edit Your Coach',
            'arcadeCoach()')}
        </div>

        <h3>Coaching Boosts</h3>

        <div class="row">
          ${button('+10 Recruiting',
            "arcadeBoost('recruit',10)")}
          ${button('+10 Development',
            "arcadeBoost('develop',10)")}
          ${button('+10 Coaching Ability',
            "arcadeBoost('skill',10)")}
        </div>
      `:`
        <p class="muted">
          Start a new dynasty and choose option 2
          to unlock Arcade controls.
        </p>
      `}
    </section>
  `;
}

function renderHistory(){
  return `
    <h2>Dynasty History</h2>

    <section>
      <h3>Completed Seasons</h3>

      ${S.seasonHistory.length?`
        <table>
          <thead>
            <tr>
              <th>Year</th>
              <th>Your School</th>
              <th>Record</th>
              <th>National Champion</th>
              <th>Recruiting</th>
            </tr>
          </thead>
          <tbody>
            ${S.seasonHistory.map(x=>`
              <tr>
                <td>${x.year}</td>
                <td>${esc(x.userSchool)}</td>
                <td>${x.wins}-${x.losses}</td>
                <td>${esc(x.champion)}</td>
                <td>#${x.recruitingRank}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `:notice('Complete a season to begin your history.')}
    </section>

    <section>
      <h3>National Champions</h3>

      ${S.champions.length
        ?S.champions.map(x=>`
          <p>
            <strong>${x.year}</strong> —
            ${esc(S.teams[x.team]?.name||'Unknown')}
            <span class="muted">
              ${esc(x.score||'')}
            </span>
          </p>
        `).join('')
        :notice('No national champions crowned yet.')}
    </section>
  `;
}

function render(){
  if(!S)return;

  renderNav();

  const sub=document.getElementById('sub');

  sub.textContent=
    `${S.year} · ${team().name} · `+
    `${S.settings.mode==='arcade'
      ?'Arcade':'Serious'} Dynasty`;

  const pages={
    'Office':renderOffice,
    'Schedule':renderSchedule,
    'Standings':renderStandings,
    'Recruiting':renderRecruiting,
    'Roster':renderRoster,
    'Coaching':renderCoaching,
    'Hall of Fame':renderHall,
    'Arcade':renderArcade,
    'History':renderHistory
  };

  const app=document.getElementById('app');

  try{
    app.innerHTML=(pages[tab]||renderOffice)();
  }catch(error){
    console.error(error);

    app.innerHTML=`
      <section>
        <h2>Screen Error</h2>
        <p>${esc(error.message)}</p>
        <button onclick="setTab('Office')">
          Return to Office
        </button>
      </section>
    `;
  }
}

function runAudit(){
  const problems=[];

  if(!S){
    problems.push('No active dynasty.');
  }else{
    if(S.teams.length!==138){
      problems.push(
        `Expected 138 schools; found ${S.teams.length}.`
      );
    }

    if(!S.coaches.find(x=>x.id===S.user)){
      problems.push('User coach missing.');
    }

    if(S.recruits.length!==650){
      problems.push(
        `Expected 650 recruits; found ${S.recruits.length}.`
      );
    }

    if(!Array.isArray(S.games)){
      problems.push('Schedule missing.');
    }

    if(!document.getElementById('modal')){
      problems.push('Recruiting dialog missing.');
    }

    if(!document.getElementById('dlg')){
      problems.push('Celebration dialog missing.');
    }
  }

  alert(
    problems.length
      ?'AUDIT FINDINGS:\n'+problems.join('\n')
      :'Basic data audit passed.\n'+
       'This does not verify all game rules or historical data.'
  );
}

/* Save startup */
(function initializeSaturdayDynasty(){
  try{
    const stored=localStorage.getItem(KEY);

    if(stored){
      S=migrate(JSON.parse(stored));
    }else{
      S=create();
      S.settings.mode='serious';
      localStorage.setItem(
        KEY,JSON.stringify(S)
      );
    }
  }catch(error){
    console.error('Save initialization failed:',error);

    S=create();
    S.settings.mode='serious';

    alert(
      'An existing save could not be loaded. '+
      'A new dynasty has been created in memory. '+
      'Export or inspect your old save before replacing it.'
    );
  }

  updateRankings();
  render();
})();

</script>
